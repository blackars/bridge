<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>:* *:</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ============ AUTH ============ -->
  <div id="auth-screen">
    <div class="auth-box">
      <h1>:* *:</h1>
      <form id="auth-form">
        <input type="email" id="email" placeholder="email" required>
        <input type="password" id="password" placeholder="password" required>
        <button type="submit" id="auth-btn">sign in</button>
        <p id="auth-error" class="error"></p>
      </form>
    </div>
  </div>

  <!-- ============ CHAT ============ -->
    <div id="chat-window" class="hidden">
    <div id="chat-header">
      <span id="chat-ttl"></span>
      <button id="close-chat-btn">x</button>
    </div>
    <p id="chat-error" class="error hidden"></p>
    <div id="messages-list">
      <div id="typing-indicator" class="msg other hidden">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </div>
    </div>
    <button id="scroll-bottom-btn" class="hidden" title="bajar">↓</button>
    <div id="message-input-area">
      <input type="text" id="message-input" placeholder="..." disabled>
      <button id="send-btn" disabled>↵</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
